# Opt-in only, after configuring ESP32, ALL Node-RED MQTT configs and HA accounts.
# Usage: docker compose -f docker-compose.yml -f compose.mqtt-secure.yml up -d mosquitto
services:
  mosquitto:
    volumes:
      - ./mosquitto/mosquitto.secure.conf:/mosquitto/config/mosquitto.conf:ro
      - ./.local/mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./mosquitto/acl.example:/mosquitto/config/acl:ro
