name: Firmware and safety tests
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh test/run-host.sh
      - run: pip install platformio PyYAML Jinja2
      - run: python test/test_notifications.py
      - run: python tools/build-home-assistant.py --check
      - run: node tools/build-flow.cjs --check
      - run: pio run -e esp32dev -e wokwi
      - run: docker compose config --quiet
      - run: docker compose -f iot-platform/docker-compose.yml config --quiet
