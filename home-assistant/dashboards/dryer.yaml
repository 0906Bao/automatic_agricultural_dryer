# Generated by tools/build-home-assistant.py; no credentials.
title: Giàn phơi nông sản
views:
- title: Giàn phơi
  path: overview
  icon: mdi:sprout
  cards:
  - type: markdown
    content: '{% if not is_state(''binary_sensor.dryer_online'',''on'') or not has_value(''sensor.dryer_mode'')
      %}

      ## ⚪ CHƯA XÁC NHẬN CHẾ ĐỘ

      Thiếu dữ liệu mới từ thiết bị. Không thể xác nhận tự động đang bật hay tắt.

      {% elif is_state(''sensor.dryer_mode'',''AUTO'') %}

      ## 🟢 TỰ ĐỘNG ĐANG BẬT

      Thiết bị đã xác nhận chế độ tự động. Bạt sẽ được yêu cầu đóng/mở theo thời tiết
      và các điều kiện an toàn.

      {% elif is_state(''sensor.dryer_mode'',''STOPPED'') %}

      ## ⏸️ TỰ ĐỘNG ĐANG TẮT

      {% if is_state(''sensor.dryer_fault'',''MOTION_TIMEOUT'') %}

      **Đã dừng do quá thời gian:** chưa chạm hành trình trong 20 giây. Trong Wokwi,
      gạt LIMIT OPEN hoặc LIMIT CLOSE sang phải để xác nhận hành trình đích. Sau khi
      kiểm tra, nhấn **Xóa lỗi**, rồi chọn lại chế độ.

      {% elif has_value(''sensor.dryer_fault'') and not is_state(''sensor.dryer_fault'',''NONE'')
      %}

      **Đang có lỗi:** {{ states(''sensor.dryer_fault_text'') }}. Khắc phục nguyên
      nhân rồi nhấn **Xóa lỗi** trước khi bật lại.

      {% else %}

      Hệ thống đang dừng. Nhấn **Bật tự động** để bắt đầu điều khiển theo thời tiết.

      {% endif %}

      {% else %}

      ## 🟠 TỰ ĐỘNG ĐANG TẮT

      Đang điều khiển thủ công. Nhấn **Bật tự động** để chuyển về điều khiển theo
      thời tiết.

      {% endif %}'
    entity_id:
    - binary_sensor.dryer_online
    - sensor.dryer_mode
    - sensor.dryer_fault
    - sensor.dryer_fault_text
    card_size: 4
  - type: markdown
    content: '# Giàn phơi nông sản

      Vị trí bạt chỉ được xác nhận bằng công tắc hành trình. **Đề xuất mở/đóng không
      có nghĩa là bạt đã tới vị trí đó.**'
  - type: entities
    title: Tổng quan
    show_header_toggle: false
    entities:
    - entity: sensor.dryer_online_text
      name: Kết nối thiết bị
    - entity: sensor.dryer_mode_text
      name: Chế độ điều khiển
    - entity: sensor.dryer_roof_position_text
      name: Vị trí bạt
    - entity: sensor.dryer_cover_request_text
      name: Đề xuất theo thời tiết
    - entity: sensor.dryer_cover_reason_text
      name: Nguyên nhân đề xuất
    - entity: sensor.dryer_motion_text
      name: Lệnh chuyển động
    - entity: sensor.dryer_fault_text
      name: Tình trạng lỗi
  - type: conditional
    conditions:
    - entity: binary_sensor.dryer_motor_output_enabled
      state: 'off'
    card:
      type: markdown
      content: '**Đầu ra motor đang khóa.** Bạt chưa tự di chuyển. Trong mô phỏng,
        gạt công tắc hành trình đóng hoặc mở sang phải để xác nhận vị trí.'
  - type: conditional
    conditions:
    - entity: binary_sensor.dryer_motor_output_enabled
      state: 'on'
    card:
      type: markdown
      content: '**Đầu ra motor đã bật.** Khi thử Wokwi, motor chưa tự tác động công
        tắc hành trình. Trước 20 giây, gạt **LIMIT OPEN hoặc LIMIT CLOSE sang phải**
        để xác nhận hành trình đích; gạt về trái để nhả trước khi đi chiều ngược lại.
        Không bật đồng thời hai hành trình. Nếu quá thời gian, hệ thống dừng và tắt
        AUTO; kiểm tra rồi nhấn **Xóa lỗi**.'
  - type: grid
    columns: 2
    square: false
    cards:
    - type: gauge
      entity: sensor.dryer_temperature
      name: Nhiệt độ
      min: -20
      max: 80
    - type: gauge
      entity: sensor.dryer_humidity
      name: Độ ẩm
      min: 0
      max: 100
      severity:
        green: 0
        yellow: 70
        red: 81
  - type: entities
    title: Môi trường
    show_header_toggle: false
    entities:
    - entity: sensor.dryer_rain_adc_text
      name: Giá trị cảm biến mưa
    - entity: sensor.dryer_rain_text
      name: Mưa
    - entity: sensor.dryer_light_adc_text
      name: Giá trị cảm biến ánh sáng
    - entity: sensor.dryer_dark_text
      name: Trời tối
    - entity: sensor.dryer_dht_valid_text
      name: Cảm biến nhiệt độ và độ ẩm
    - entity: sensor.dryer_safe_to_open_text
      name: Điều kiện mở bạt
  - type: grid
    title: Chọn chế độ và điều khiển
    columns: 3
    square: false
    cards:
    - type: button
      name: Mở bạt
      icon: mdi:arrow-expand-vertical
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.dryer_open
        confirmation:
          text: Gửi yêu cầu mở bạt? ESP32 vẫn kiểm tra điều kiện an toàn.
    - type: button
      name: Đóng bạt
      icon: mdi:arrow-collapse-vertical
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.dryer_close
    - type: button
      name: Dừng bạt
      icon: mdi:stop
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.dryer_stop
    - type: button
      name: Bật tự động
      icon: mdi:autorenew
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.dryer_auto
    - type: button
      name: Tắt tự động / dừng
      icon: mdi:hand-back-right
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.dryer_manual
    - type: button
      name: Xóa lỗi
      icon: mdi:restart-alert
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.dryer_reset
        confirmation:
          text: Gửi yêu cầu xóa lỗi? ESP32 vẫn kiểm tra điều kiện an toàn.
  - type: entities
    title: Hành trình và bảo vệ
    show_header_toggle: false
    entities:
