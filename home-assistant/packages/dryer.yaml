script:
  dryer_send_command:
    alias: Dryer - gửi yêu cầu điều khiển
    mode: parallel
    max: 5
    fields:
      command:
        required: true
        selector:
          select:
            options:
            - OPEN
            - CLOSE
            - AUTO
            - MANUAL
            - STOP
            - RESET
    sequence:
    - condition: template
      value_template: '{{ command in [''OPEN'',''CLOSE'',''AUTO'',''MANUAL'',''STOP'',''RESET'']
        }}'
    - action: mqtt.publish
      data:
        topic: dryer/ha/command
        qos: 0
        retain: false
        payload: '{{ {''command'': command, ''issued_at'': (as_timestamp(now()) *
          1000) | int} | to_json }}'
template:
- cover:
  - name: Mái che giàn phơi
    unique_id: dryer_roof
    default_entity_id: cover.dryer_roof
    device_class: awning
    optimistic: false
    availability: '{{ is_state(''binary_sensor.dryer_online'',''on'') and has_value(''binary_sensor.dryer_limit_closed'')
      and has_value(''binary_sensor.dryer_limit_open'') }}'
    state: '{% if is_state(''binary_sensor.dryer_limit_closed'',''on'') and is_state(''binary_sensor.dryer_limit_open'',''off'')
      %}closed{% elif is_state(''binary_sensor.dryer_limit_open'',''on'') and is_state(''binary_sensor.dryer_limit_closed'',''off'')
      %}open{% else %}{{ none }}{% endif %}'
    open_cover:
    - action: script.dryer_send_command
      data:
        command: OPEN
    close_cover:
    - action: script.dryer_send_command
      data:
        command: CLOSE
    stop_cover:
    - action: script.dryer_send_command
      data:
        command: STOP
- sensor:
  - name: Mức an toàn
    unique_id: dryer_safety_status_text
