automation:
- id: dryer_decision_changed
  alias: Giàn phơi - đề xuất hoặc điều kiện an toàn thay đổi
  mode: queued
  max: 50
  triggers:
  - trigger: state
    entity_id: sensor.dryer_decision
    to: null
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not
      in [''unknown'',''unavailable'',''''] and (trigger.from_state is none or trigger.from_state.state
      != trigger.to_state.state) }}'
  actions:
  - action: persistent_notification.create
    data:
      title: Giàn phơi · cập nhật đề xuất và an toàn
      message: '{% set a = trigger.to_state.attributes %}

        Đề xuất: {{ {''OPEN'':''Mở bạt'',''CLOSE'':''Đóng bạt''}.get(a.cover_request,
        ''Chưa xác nhận'') }}.

        Nguyên nhân: {{ {''NORMAL'':''Điều kiện bình thường'',''WAITING_SAFE'':''Đang
        chờ đủ 10 giây an toàn'',''RAIN'':''Có mưa'',''DARK'':''Trời tối'',''DHT_ERROR'':''Lỗi
        cảm biến DHT'',''HUMIDITY_WARNING'':''Độ ẩm cao 70–80%'',''HUMIDITY_DANGER'':''Độ
        ẩm nguy hiểm trên 80%''}.get(a.cover_reason, a.cover_reason) }}.

        Mức an toàn: {{ {''SAFE'':''An toàn / đủ điều kiện mở'',''WARNING'':''Cảnh
        báo'',''DANGER'':''Nguy hiểm hoặc đang có lỗi'',''WAITING'':''Đang chờ đủ
        thời gian an toàn''}.get(a.safety_status, a.safety_status) }}.

        Độ ẩm: {{ (a.humidity_pct | string + ''%'') if a.dht_valid else ''Không hợp
        lệ'' }}.

        {% if a.cover_reason == ''HUMIDITY_WARNING'' %}

        Chỉ đề xuất đóng bạt. Hệ thống không tự đóng chỉ vì độ ẩm 70–80%; bạn có thể
        nhấn Đóng bạt để xác nhận.

        {% elif a.mode == ''AUTO'' %}

        AUTO đang bật; thiết bị điều khiển theo điều kiện an toàn và hành trình.

        {% else %}

        AUTO đang tắt. Đề xuất này không tự thực hiện chuyển động.

        {% endif %}

        {% if a.fault != ''NONE'' %}Lỗi thiết bị: {{ a.fault }}.{% endif %}

        {% if a.estop %}Dừng khẩn đang kích hoạt.{% endif %}

        {% if a.driver_fault %}Driver motor đang báo lỗi.{% endif %}

        {% if a.limit_fault %}Hai công tắc hành trình cùng kích hoạt.{% endif %}

        Mưa: {{ ''Có'' if a.rain else ''Không'' }} · Ánh sáng: {{ ''Tối'' if a.dark
        else ''Sáng'' }}.

        '
- id: dryer_offline
  alias: Giàn phơi - Giàn phơi mất kết nối
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.dryer_online
    to: 'off'
    for: 00:00:10
  - trigger: state
    entity_id: binary_sensor.dryer_online
    to: unavailable
    for: 00:00:10
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_offline
      title: Giàn phơi mất kết nối
      message: Không có telemetry mới hoặc bridge MQTT/Node-RED mất kết nối. Không
        thể xác nhận vị trí; dùng dừng khẩn vật lý nếu cần.
- id: dryer_command_failed
  alias: Giàn phơi - Yêu cầu điều khiển chưa được thực hiện
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.dryer_command_result
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_command_failed
      title: Yêu cầu điều khiển chưa được thực hiện
      message: 'Lệnh {{ state_attr(''sensor.dryer_command_result'',''command'') }}:
        {{ states(''sensor.dryer_command_result'') }}. Mở bạt cần khô, sáng, DHT hợp
        lệ và độ ẩm dưới 70% liên tục 10 giây; kiểm tra dừng khẩn và lỗi hành trình.
        TIMEOUT nghĩa là chưa có xác nhận, không tự gửi lại.'
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.dryer_command_result'').startswith(''REJECTED'')
      or states(''sensor.dryer_command_result'') in [''TIMEOUT'',''DEVICE_RESTARTED'',''SUPERSEDED'']
      }}'
