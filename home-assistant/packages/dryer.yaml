    icon: mdi:shield-alert
  - name: Đề xuất theo thời tiết
    unique_id: dryer_cover_request_text
    default_entity_id: sensor.dryer_cover_request_text
    state: '{% set value = states(''sensor.dryer_cover_request'') %}{% if not is_state(''binary_sensor.dryer_online'',''on'')
      %}Mất kết nối{% elif value in [''unknown'',''unavailable''] %}Chưa có dữ liệu{%
