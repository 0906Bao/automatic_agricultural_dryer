      else %}{{ {''AUTO'': ''Tự động'', ''STOPPED'': ''Đang dừng'', ''MANUAL_OPEN'':
      ''Thủ công: mở bạt'', ''MANUAL_CLOSE'': ''Thủ công: đóng bạt''}.get(value, ''Chưa
      có dữ liệu'') }}{% endif %}'
    icon: mdi:autorenew
  - name: Lệnh chuyển động
    unique_id: dryer_motion_text
