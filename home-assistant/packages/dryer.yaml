      %}Mất kết nối{% elif value in [''unknown'',''unavailable''] %}Chưa có dữ liệu{%
      else %}{{ {''IDLE'': ''Đứng yên'', ''OPENING'': ''Yêu cầu mở bạt'', ''CLOSING'':
      ''Yêu cầu đóng bạt'', ''REVERSAL_WAIT'': ''Chờ đổi chiều'', ''FAULT'': ''Dừng
