automation:
- id: dryer_rain
  alias: Giàn phơi - Phát hiện mưa
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.dryer_rain
    to: 'on'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_rain
      title: Phát hiện mưa
      message: ESP32 phát hiện mưa. Chế độ AUTO sẽ yêu cầu che bạt; kiểm tra hành
        trình để biết vị trí thực tế.
- id: dryer_humidity_warning
  alias: Giàn phơi - Độ ẩm cao
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.dryer_humidity_warning
    to: 'on'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_humidity_warning
      title: Độ ẩm cao
      message: Độ ẩm từ 70% trở lên. Chưa đủ điều kiện mở bạt; theo dõi hiệu quả phơi.
- id: dryer_humidity_danger
  alias: Giàn phơi - Độ ẩm nguy hiểm
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.dryer_humidity_danger
    to: 'on'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_humidity_danger
      title: Độ ẩm nguy hiểm
      message: Độ ẩm trên 80%. ESP32 cấm mở và AUTO yêu cầu che bạt.
- id: dryer_limit_fault
  alias: Giàn phơi - Lỗi công tắc hành trình
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.dryer_limit_fault
    to: 'on'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_limit_fault
      title: Lỗi công tắc hành trình
      message: Hai công tắc đóng và mở cùng kích hoạt. ESP32 chốt lỗi, cần kiểm tra
        đấu dây và cơ khí trước RESET.
- id: dryer_dht_error
  alias: Giàn phơi - Lỗi DHT22
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.dryer_dht_valid
    to: 'off'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_dht_error
      title: Lỗi DHT22
      message: Số đo DHT22 không hợp lệ. Không dùng số đo cuối làm dữ liệu hiện tại;
        ESP32 cấm mở.
- id: dryer_offline
  alias: Giàn phơi - Giàn phơi mất kết nối
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.dryer_online
    to: 'off'
    for: 00:00:10
  - trigger: state
    entity_id: binary_sensor.dryer_online
    to: unavailable
    for: 00:00:10
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_offline
      title: Giàn phơi mất kết nối
      message: Không có telemetry mới hoặc bridge MQTT/Node-RED mất kết nối. Không
        thể xác nhận vị trí; dùng dừng khẩn vật lý nếu cần.
- id: dryer_command_failed
  alias: Giàn phơi - Yêu cầu điều khiển chưa được thực hiện
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.dryer_command_result
  actions:
  - action: persistent_notification.create
    data:
      notification_id: dryer_command_failed
      title: Yêu cầu điều khiển chưa được thực hiện
      message: 'Lệnh {{ state_attr(''sensor.dryer_command_result'',''command'') }}:
        {{ states(''sensor.dryer_command_result'') }}. Mở bạt cần khô, sáng, DHT hợp
        lệ và độ ẩm dưới 70% liên tục 30 giây; kiểm tra dừng khẩn và lỗi hành trình.
        TIMEOUT nghĩa là chưa có xác nhận, không tự gửi lại.'
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.dryer_command_result'').startswith(''REJECTED'')
      or states(''sensor.dryer_command_result'') in [''TIMEOUT'',''DEVICE_RESTARTED'',''SUPERSEDED'']
      }}'
